<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KeepFirst</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#0a0a0f;--card:#16161e;--tx:#ececf4;--mu:#9a9ab0;--ln:#26262f;--ac:#a78bfa;--soft:#2a2340;--onac:#14101f;--red:#f0686c;--grn:#2fa36b}
:root[data-theme="light"]{--bg:#f3f4fa;--card:#fff;--tx:#1e2233;--mu:#6c7389;--ln:#e4e6f0;--ac:#6d4fd8;--soft:#ede8fd;--onac:#fff;--red:#e5484d}

*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:12px 18px}
h1{margin:0;font-size:26px}button,input,select,textarea{font:inherit;color:var(--tx)}

.ib{border:0;background:var(--card);border-radius:50%;width:42px;height:42px;font-size:20px;cursor:pointer;box-shadow:0 1px 3px #0002}
.card,.it{background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 3px #0001;animation:up .25s ease}
@keyframes up{from{opacity:0;transform:translateY(6px)}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}.grid .card{margin:0;text-align:left;border:0;cursor:pointer}
.big{font-size:26px;font-weight:700;color:var(--ac)}.mu{color:var(--mu);font-size:14px}.ico{font-size:28px}
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;margin-bottom:14px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;padding:9px 12px;border-radius:10px;color:var(--mu);font-weight:600;cursor:pointer;white-space:nowrap}
.seg .on{background:var(--ac);color:#fff}
h4{margin:16px 4px 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu)}h4 i{font-style:normal;background:var(--soft);color:var(--ac);border-radius:9px;padding:1px 8px;margin-left:4px}
.it{display:flex;gap:12px;align-items:flex-start;cursor:pointer}.bd{flex:1;min-width:0;word-break:break-word}.dn .bd>b{text-decoration:line-through;color:var(--mu)}
.ck{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--ln);background:none;color:transparent;cursor:pointer;font-size:14px;padding:0}.ck.on{background:var(--grn);border-color:var(--grn);color:#fff}
.sb{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:15px}.sb.dn{color:var(--mu);text-decoration:line-through}.ck.s{width:20px;height:20px;font-size:11px}
.mt{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}.bg{font-size:12px;background:var(--soft);color:var(--ac);border-radius:8px;padding:2px 8px}.bg.red,.bg.pHigh{background:#e5484d22;color:var(--red)}.bg.pLow{color:var(--mu)}
.sn{margin:6px 0 0;color:var(--mu);font-size:14px;white-space:pre-wrap}
.bar{height:8px;background:var(--ln);border-radius:9px;margin:8px 0 2px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:11px 12px;margin:4px 0 12px}textarea{min-height:90px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);border-color:transparent}label{font-size:13px;color:var(--mu)}
.btn{border:0;background:var(--ac);color:#fff;border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer}.btn.g{background:var(--soft);color:var(--ac)}.btn.r{background:#e5484d22;color:var(--red)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--ln);z-index:6}
nav button{flex:1;border:0;background:none;color:var(--mu);font-size:11px;padding:6px 0;cursor:pointer;border-radius:12px}nav button span{display:block;font-size:22px}nav .on{color:var(--ac);font-weight:700}
.fab{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:30px;box-shadow:0 4px 12px #0004;z-index:6;cursor:pointer}
#m{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:20}#m.on{display:flex}
#sh{background:var(--card);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}#sh h3{margin:0 0 12px}
#t{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:30}#t.on{opacity:.95}
.emp{text-align:center;color:var(--mu);padding:30px 10px}.rb{position:fixed;left:12px;right:12px;top:calc(64px + env(safe-area-inset-top,0px));background:var(--ac);color:var(--onac);padding:12px 14px;border-radius:14px;z-index:25;display:none;align-items:center;gap:8px;box-shadow:0 4px 14px #0006}.rb span{flex:1}.rb .x{color:var(--onac)}.btn:not(.g):not(.r),.seg .on,.fab,.cd.sel{color:var(--onac)}.ws{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:0;cursor:pointer;color:var(--tx);font:inherit}.ws>div:nth-child(2){flex:1}.ring{flex:none;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--ac) calc(var(--p)*1%),var(--ln) 0);display:grid;place-items:center}.ring b{background:var(--card);width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:20px}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-top:10px}.cd{border:0;background:none;border-radius:12px;padding:9px 0;cursor:pointer;position:relative}.cd.sel{background:var(--ac);color:#fff}.cd.tdy{outline:2px solid var(--ac)}.cd u{position:absolute;bottom:3px;left:50%;width:5px;height:5px;margin-left:-2px;border-radius:50%;background:var(--red)}#ov{display:none;position:fixed;inset:0;background:var(--bg);z-index:40;align-items:center;justify-content:center}.err{color:var(--red);font-size:14px;min-height:20px}
</style></head><body>
<header><h1 id="ttl">KeepFirst</h1><button class="ib" data-a="set" aria-label="Settings">⚙️</button></header>
<main id="app"></main><button class="fab" id="fab" data-a="fab" aria-label="Add">+</button>
<nav id="nv"></nav><div id="ov"></div><div id="m"><div id="sh"></div></div><div id="t"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,"0"),today=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())},fd=d=>new Date(d+"T00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"});
const blank=()=>({tasks:[],goals:[],notes:[],plan:[],gmails:[],apps:[],prefs:{name:"",theme:""}});
let D=blank();try{const x=JSON.parse(localStorage.getItem("ms_data"));if(x)D=Object.assign(blank(),x)}catch(e){}
const save=()=>{try{localStorage.setItem("ms_data",JSON.stringify(D))}catch(e){toast("Could not save: storage is full")}};
let tab="home",sub={personal:"tasks",work:"tasks",accounts:"apps"},Q="",FG="",VC="",shown={},V={key:null,list:[],salt:""},pend=null,cur=null;
const toast=m=>{const t=$("#t");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),1600)};
const emp=t=>`<div class="emp">${t}</div>`,gp=g=>g.subs&&g.subs.length?Math.round(g.subs.filter(s=>s.d).length/g.subs.length*100):Math.min(100,+g.prog||0);
// ---- vault crypto (PBKDF2 + AES-GCM, nothing readable is stored)
const enc=new TextEncoder(),dec=new TextDecoder(),b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))),ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function mk(pw,salt){const k=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:310000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function vsave(){const iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},V.key,enc.encode(JSON.stringify(V.list)));localStorage.setItem("ms_vault",JSON.stringify({s:V.salt,i:b64(iv),c:b64(ct)}))}
async function vunlock(pw){const o=JSON.parse(localStorage.getItem("ms_vault")),key=await mk(pw,ub(o.s)),pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(o.i)},key,ub(o.c));V.key=key;V.salt=o.s;V.list=JSON.parse(dec.decode(pt))}
async function vsetup(pw){const s=crypto.getRandomValues(new Uint8Array(16));V.salt=b64(s);V.key=await mk(pw,s);V.list=[];await vsave()}
const lock=()=>{lockV(V);render()};const touch=()=>{if(V.key&&sub[tab]==="vault")V.last=Date.now()};
["click","keydown","touchstart","input","scroll"].forEach(e=>document.addEventListener(e,touch,{passive:true,capture:true}));
const gen=(n=20)=>{const cs="abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%^&*-_?",r=crypto.getRandomValues(new Uint32Array(n));return[...r].map(x=>cs[x%cs.length]).join("")};
// ---- schemas
const F={task:{c:"tasks",n:"task",f:[["t","Title","text"],["ctx","Belongs to","sel",["Personal","Work"]],["due","Due date","date"],["pri","Priority","sel",["High","Medium","Low"],"Medium"],["status","Status","sel",["To do","In progress","Blocked"]],["subs","Subtasks / checklist (one per line)","lines"],["notes","Notes","area"]]},
goal:{c:"goals",n:"goal",f:[["t","Goal","text"],["ctx","Belongs to","sel",["Personal","Work"]],["kind","Type","sel",["Short-term","Long-term"]],["due","Deadline","date"],["desc","Description","area"],["subs","Steps / milestones (one per line)","lines"],["prog","Progress % (used if no steps)","num"]]},
note:{c:"notes",n:"note",f:[["t","Title","text"],["ctx","Belongs to","sel",["Personal","Work"]],["tag","Tag / folder","text"],["body","Note (links welcome)","area"]]},
plan:{c:"plan",n:"entry",f:[["t","What","text"],["kind","Type","sel",["Appointment","Routine","Important date"]],["date","Date","date"],["time","Time","time"]]},
gmail:{c:"gmails",n:"Gmail account",f:[["email","Gmail address","text"],["nick","Nickname (Personal, Work, Backup…)","text"],["purpose","Purpose","text"],["notes","Notes","area"]]},
app:{c:"apps",n:"app / website",f:[["name","App or website","text"],["gid","Gmail used","gsel"],["url","Website URL","text"],["cat","Category","text"],["user","Username (if different)","text"],["vid","Linked vault entry","vsel"],["notes","Notes","area"]]}};
function modal(h){$("#sh").innerHTML=h;$("#m").classList.add("on")}const closeM=()=>$("#m").classList.remove("on");
const ask=(msg,fn)=>{pend=fn;modal(`<h3>Are you sure?</h3><p>${msg}</p><div class="row"><button class="btn g" data-a="x">Cancel</button><button class="btn r" data-a="yes">Yes</button></div>`)};
function openForm(kind,id,ctx){const S=F[kind],old=D[S.c].find(x=>x.id===id),it=old||{id:uid(),ctx:ctx||"Personal",date:kind==="plan"?CS:""};cur={kind,id:it.id,old:!!old};
let h=`<h3>${old?"Edit":"Add"} ${S.n}</h3>`;
S.f.forEach(([k,l,ty,op,df],i)=>{const v=it[k]??"",a=`id="f${i}"`;h+=`<label>${l}</label>`;
if(ty==="sel")h+=`<select ${a}>${op.map(o=>`<option${(v||df||op[0])===o?" selected":""}>${o}</option>`).join("")}</select>`;
else if(ty==="gsel")h+=`<select ${a}><option value="">None</option>${D.gmails.filter(g=>(g.ctx||"Personal")===it.ctx).map(g=>`<option value="${g.id}"${v===g.id?" selected":""}>${E(g.nick||g.email)}</option>`).join("")}</select>`;
else if(ty==="vsel")h+=V.key?`<select ${a}><option value="">None</option>${V.list.map(g=>`<option value="${g.id}"${v===g.id?" selected":""}>${E(g.name)}</option>`).join("")}</select>`:`<p class="mu" ${a} data-keep="${E(v)}">Unlock the Vault to link an entry.</p>`;
else if(ty==="area")h+=`<textarea ${a}>${E(v)}</textarea>`;
else if(ty==="lines")h+=`<textarea ${a}>${E((it[k]||[]).map(s=>s.t).join("\n"))}</textarea>`;
else h+=`<input ${a} type="${ty}" value="${E(v)}">`});
h+=`<div class="row">${old?'<button class="btn r" data-a="del">Delete</button>':""}<button class="btn g" data-a="x">Cancel</button><button class="btn" data-a="save">Save</button></div>`;modal(h)}
function saveForm(){const S=F[cur.kind],arr=D[S.c],old=arr.find(x=>x.id===cur.id),it=old||{id:cur.id},v={};
S.f.forEach(([k,l,ty],i)=>{const el=$("#f"+i);let x=ty==="vsel"&&!V.key?el.dataset.keep:el.value.trim();
if(ty==="lines")x=el.value.split("\n").map(s=>s.trim()).filter(Boolean).map(t=>({t,d:!!(it[k]||[]).find(s=>s.t===t&&s.d)}));v[k]=x});
if(!(v.t||v.email||v.name)){toast("Please add a title");return}if(v.url&&!/^https?:\/\//i.test(v.url))v.url="https://"+v.url;
Object.assign(it,v);if(!old)arr.push(it);save();closeM();render()}
// ---- vault entry form
function openV(id){const e=V.list.find(x=>x.id===id)||{};cur={v:1,id:e.id||uid(),old:!!e.id};
const f=(k,l,t="text")=>`<label>${l}</label><input id="v${k}" type="${t}" value="${E(e[k]||"")}">`;
modal(`<h3>${e.id?"Edit":"Add"} login</h3>${f("name","Website or app")}${f("user","Gmail or username")}<label>Password</label><div class="row" style="flex-wrap:nowrap"><input id="vpw" type="text" value="${E(e.pw||"")}"><button class="btn g" style="flex:none;margin:4px 0 12px" data-a="gen">Generate</button></div>${f("url","Website URL")}${f("cat","Category")}<label>Notes</label><textarea id="vnotes">${E(e.notes||"")}</textarea><div class="row">${e.id?'<button class="btn r" data-a="vdel">Delete</button>':""}<button class="btn g" data-a="x">Cancel</button><button class="btn" data-a="vsv">Save</button></div>`)}
async function saveV(){const g=k=>$("#v"+k).value.trim(),e={id:cur.id,name:g("name"),user:g("user"),pw:$("#vpw").value,url:g("url"),cat:g("cat"),notes:g("notes")};if(!e.name){toast("Please add a name");return}
const i=V.list.findIndex(x=>x.id===e.id);i<0?V.list.push(e):V.list[i]=e;await vsave();closeM();render()}
// ---- views
const taskC=t=>`<div class="it${t.done?" dn":""}" data-a="edit" data-kind="task" data-id="${t.id}"><button class="ck${t.done?" on":""}" data-a="tog" data-col="tasks" data-id="${t.id}">✓</button><div class="bd"><b>${E(t.t)}</b><div class="mt">${t.due?`<span class="bg${t.due<today()&&!t.done?" red":""}">📅 ${fd(t.due)}</span>`:""}<span class="bg p${t.pri||"Medium"}">${t.pri||"Medium"}</span>${t.ctx==="Work"&&t.status?`<span class="bg">${E(t.status)}</span>`:""}</div>${subsH(t,"tasks")}${t.notes?`<p class="sn">${E(t.notes)}</p>`:""}</div></div>`;
const subsH=(o,c)=>(o.subs||[]).map((s,i)=>`<div class="sb${s.d?" dn":""}"><button class="ck s${s.d?" on":""}" data-a="tog" data-col="${c}" data-id="${o.id}" data-i="${i}">✓</button>${E(s.t)}</div>`).join("");
function tasksH(c){const T=D.tasks.filter(t=>t.ctx===c).sort((a,b)=>(a.due||"9")>(b.due||"9")?1:-1),td=today(),op=T.filter(t=>!t.done);
return[["Overdue",op.filter(t=>t.due&&t.due<td)],["Today",op.filter(t=>t.due===td)],["Upcoming",op.filter(t=>!t.due||t.due>td)],["Completed",T.filter(t=>t.done)]].map(([n,a])=>a.length?`<h4>${n}<i>${a.length}</i></h4>`+a.map(taskC).join(""):"").join("")||emp("No tasks yet. Tap + to add one.")}
const goalC=g=>`<div class="it" data-a="edit" data-kind="goal" data-id="${g.id}"><div class="bd"><b>${E(g.t)}</b><div class="mt"><span class="bg">${E(g.kind||"Goal")}</span>${g.due?`<span class="bg">🎯 ${fd(g.due)}</span>`:""}</div>${g.desc?`<p class="sn">${E(g.desc)}</p>`:""}<div class="bar"><i style="width:${gp(g)}%"></i></div><span class="mu">${gp(g)}%</span>${subsH(g,"goals")}</div></div>`;
function notesH(c){const q=Q.toLowerCase(),a=D.notes.filter(n=>n.ctx===c&&(n.t+n.body+(n.tag||"")).toLowerCase().includes(q)).sort((a,b)=>(b.pin?1:0)-(a.pin?1:0));
return a.map(n=>`<div class="it" data-a="edit" data-kind="note" data-id="${n.id}"><div class="bd"><b>${n.pin?"📌 ":""}${E(n.t)}</b>${n.tag?`<div class="mt"><span class="bg">${E(n.tag)}</span></div>`:""}<p class="sn">${E((n.body||"").slice(0,160))}</p></div><button class="ib" data-a="pin" data-id="${n.id}">${n.pin?"★":"☆"}</button></div>`).join("")||emp("No notes found.")}
function planH(){const td=today(),P=[...D.plan].sort((a,b)=>(a.date+(a.time||""))>(b.date+(b.time||""))?1:-1),row=p=>`<div class="it" data-a="edit" data-kind="plan" data-id="${p.id}"><div class="bd"><b>${E(p.t)}</b><div class="mt"><span class="bg">${p.date?fd(p.date):"Anytime"}${p.time?" · "+p.time:""}</span><span class="bg">${E(p.kind||"")}</span></div></div></div>`;
const up=P.filter(p=>!p.date||p.date>=td),old=P.filter(p=>p.date&&p.date<td).slice(-5);
return(up.length?`<h4>Upcoming</h4>`+up.map(row).join(""):emp("Nothing planned. Tap + to add an appointment, routine or date."))+(old.length?`<h4>Earlier</h4>`+old.map(row).join(""):"")}
let CM=new Date(),CS=today();
const planRow=p=>`<div class="it" data-a="edit" data-kind="plan" data-id="${p.id}"><div class="bd"><b>${E(p.t)}</b><div class="mt"><span class="bg">${p.time||"Anytime"}</span><span class="bg">${E(p.kind||"")}</span></div></div></div>`;
function calH(){const y=CM.getFullYear(),m=CM.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),mk={};D.plan.forEach(p=>p.date&&(mk[p.date]=1));D.tasks.forEach(t=>t.ctx==="Personal"&&!t.done&&t.due&&(mk[t.due]=1));
let c="";for(let i=0;i<f;i++)c+="<i></i>";for(let d=1;d<=n;d++){const k=y+"-"+pad(m+1)+"-"+pad(d);c+=`<button class="cd${k===CS?" sel":""}${k===today()?" tdy":""}" data-a="cd" data-d="${k}">${d}${mk[k]?"<u></u>":""}</button>`}
const ev=D.plan.filter(p=>p.date===CS).sort((a,b)=>(a.time||"")>(b.time||"")?1:-1),ts=D.tasks.filter(t=>t.ctx==="Personal"&&t.due===CS);
return`<div class="card"><div class="row" style="align-items:center;flex-wrap:nowrap"><button class="ib" data-a="cm" data-d="-1" style="flex:none">‹</button><b style="text-align:center">${CM.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</b><button class="ib" data-a="cm" data-d="1" style="flex:none">›</button></div><div class="cal">${"SMTWTFS".split("").map(x=>`<span class="mu">${x}</span>`).join("")}${c}</div></div><h4>${fd(CS)}</h4>`+(ev.length||ts.length?ev.map(planRow).join("")+ts.map(taskC).join(""):emp("Nothing on this day. Tap + to add something."))}
const gname=id=>{const g=D.gmails.find(x=>x.id===id);return g?g.nick||g.email:""};
